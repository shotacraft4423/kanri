name: kanri
description: >
  個人事業・小規模販売向け 商品・仕入れ・在庫・売上・発送管理アプリ（オフライン/端末内暗号化DB）
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # ローカル暗号化データベース (SQLCipher)
  sqflite_sqlcipher: ^3.1.0
  path: ^1.9.0
  path_provider: ^2.1.3

  # 端末セキュアストレージ（暗号化キー・PINハッシュ保管。iOS Keychain / Android Keystore）
  flutter_secure_storage: ^9.2.2

  # 生体認証
  local_auth: ^2.3.0

  # ID生成
  uuid: ^4.4.0

  # 日付フォーマット
  intl: ^0.19.0

  # CSV出力
  csv: ^6.0.0

  # 暗号化バックアップ (AES-GCM / PBKDF2)
  cryptography: ^2.7.0

  # ファイル保存・共有・選択（エクスポート/インポート）
  file_picker: ^8.0.6
  share_plus: ^9.0.0

  # 追跡番号タップで配送会社サイトを開く（オンライン時のみ使用する任意機能）
  url_launcher: ^6.3.0

  # アプリ切替時のスクリーンショット/画面録画対策 (Androidは自前MethodChannelでも可)
  screen_protector: ^1.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
