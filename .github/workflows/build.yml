name: Build web preview & Android APK

on:
  push:
    branches:
      - claude/small-business-sales-app-j3ckst
      - main
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart run sqflite_common_ffi_web:setup
      - run: flutter build web --release --no-wasm-dry-run --base-href "/${{ github.event.repository.name }}/"
      - run: touch build/web/.nojekyll
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref_name == github.event.repository.default_branch || github.ref_name == 'claude/small-business-sales-app-j3ckst'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          force_orphan: true

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: kanri-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
