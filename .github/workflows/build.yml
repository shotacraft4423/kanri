name: Build web preview, Android APK & iOS verify

on:
  push:
    branches:
      - claude/small-business-sales-app-j3ckst
      - main
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart run sqflite_common_ffi_web:setup
      - run: flutter build web --release --no-wasm-dry-run --base-href "/${{ github.event.repository.name }}/"
      - run: touch build/web/.nojekyll
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref_name == github.event.repository.default_branch || github.ref_name == 'claude/small-business-sales-app-j3ckst'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          force_orphan: true

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: kanri-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

  build-ios-verify:
    # 署名なしのコンパイル確認のみ。App Store IDやApple Developer Programが無いと
    # 実機にインストールできるIPAは作れないため、ここではビルドが通ることの確認に留める。
    # 実機で使うには、Xcodeが動くMacで `flutter build ipa` を実行し、
    # 無料のApple ID(パーソナルチーム、7日で失効)または有料のDeveloper Program
    # (TestFlight配布、期限なし)で署名する必要がある。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: kanri-ios-unsigned-app
          path: build/ios/iphoneos/Runner.app
          retention-days: 30
